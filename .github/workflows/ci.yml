name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
# Double trigger note: same-repo PRs fire both push (branch update) and pull_request;
# concurrency group dedups overlapping runs on the same ref.

permissions:
  contents: read

jobs:
  prebuild-devcontainer:
    name: Prebuild DevContainer Image
    # Skip fork PRs: GITHUB_TOKEN is read-only on forks and prebuild requires packages:write + push.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare CI environment
        run: bash scripts/ci_ensure_env.sh

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build and push devcontainer image
        uses: devcontainers/ci@v0.3.1900000450
        with:
          imageName: ghcr.io/th3un1q3/edgent-smith
          cacheFrom: ghcr.io/th3un1q3/edgent-smith
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}

  ci:
    name: Format · Lint · Type-check · Tests · Workflow Security
    runs-on: ubuntu-latest
    # Raised 20 -> 30 min so the mutation wrapper (MUTATION_TIMEOUT=1260s) can use its headroom;
    # 1260s mutation + setup + the other 12 gates fits inside 1800s.
    timeout-minutes: 30
    needs: prebuild-devcontainer
    if: always() && (needs.prebuild-devcontainer.result == 'success' || needs.prebuild-devcontainer.result == 'skipped')
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Prepare CI environment
        run: bash scripts/ci_ensure_env.sh --no-infra

      # Warm the Stryker incremental cache. devcontainers/ci bind-mounts the workspace
      # (repo root -> /workspace), so Stryker's cwd-relative incrementalFile
      # (reports/... under /workspace/.opencode) and this host path are the same file.
      # The key is segmented: the first hash covers dependency/toolchain inputs that can
      # change mutant semantics (lockfile, DevContainer toolchain), the second the
      # mutatable source/test/config. restore-keys repeats only the dependency/toolchain
      # hash, so a source-only change warm-falls-back to a cache from the same
      # environment while dependency/toolchain drift cannot cross-reuse stale verdicts.
      # bump -v2- to invalidate wholesale (e.g. a Stryker major schema change).
      - name: Restore Stryker incremental cache
        id: stryker-cache
        uses: actions/cache/restore@v4
        with:
          path: .opencode/reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-v2-${{ hashFiles('.opencode/bun.lock', '.opencode/package.json', '.devcontainer/devcontainer.json', '.devcontainer/docker-compose.yml', '.devcontainer/setup-dev.sh') }}-${{ hashFiles('.opencode/plugins/**/*.ts', '.opencode/plugins/tests/**/*.test.ts', '.opencode/stryker.config.mjs', '.opencode/vitest.config.ts', '.opencode/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-stryker-v2-${{ hashFiles('.opencode/bun.lock', '.opencode/package.json', '.devcontainer/devcontainer.json', '.devcontainer/docker-compose.yml', '.devcontainer/setup-dev.sh') }}-

      # The runner user (uid 1001) owns restored files while the container runs as
      # `vscode` (uid 1000). chmod (portable, no sudo) makes the restored dir/file
      # writable by the container; mkdir also covers a cache miss.
      - name: Normalize Stryker cache permissions
        run: |
          d=.opencode/reports
          mkdir -p "$d"
          chmod -R a+rwX "$d"

      # Run everything inside the existing DevContainer – no separate Python setup.
      # Build-layer caching uses the prebuilt ghcr.io image (cacheFrom below): this
      # action version takes image references for cacheFrom/cacheTo, not buildx
      # `type=gha` specs, and the prebuild job already pushes the warm layer cache.
      - uses: devcontainers/ci@v0.3.1900000450
        with:
          cacheFrom: ghcr.io/th3un1q3/edgent-smith
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            DEVCONTAINER=true
          # The incremental file is validated in-container, with the parity image's
          # own runtime, and a marker is left for the host save step. Never cache an
          # empty, partial, or corrupt file: a killed/timed-out run may leave a
          # truncated one. Validation runs even when `just ci` fails so a warmed
          # previous-valid file is preserved, and the gate exit code is preserved so
          # a failing gate still fails the step.
          runCmd: |
            if just ci; then
              gate_status=0
            else
              gate_status=$?
            fi
            f=.opencode/reports/stryker-incremental.json
            marker=.opencode/reports/.stryker-cache-ok
            rm -f "$marker"
            if [ ! -f .opencode/bun.lock ]; then
              echo "::warning::dependency lockfile missing at key time; skipping save to avoid freezing a constant cache key"
            elif [ -s "$f" ] && python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"; then
              chmod a+r "$f" 2>/dev/null || true
              echo ok > "$marker"
            else
              echo "::warning::Stryker incremental file missing or not valid JSON; skipping cache save"
            fi
            exit "$gate_status"

      # Deterministic host check, independent of hashFiles/gitignore semantics: the
      # container writes the marker only for a non-empty, JSON-parseable incremental
      # file. `always()` lets it run after a failing gate; the save step then keys off
      # the emitted output instead of probing the gitignored reports directory.
      - name: Check Stryker cache marker
        id: stryker-cache-marker
        if: always()
        run: |
          if [ -f .opencode/reports/.stryker-cache-ok ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Stryker incremental cache
        if: always() && steps.stryker-cache.outputs.cache-primary-key != '' && steps.stryker-cache-marker.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: .opencode/reports/stryker-incremental.json
          key: ${{ steps.stryker-cache.outputs.cache-primary-key }}
