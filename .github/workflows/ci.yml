name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
# Double trigger note: same-repo PRs fire both push (branch update) and pull_request;
# concurrency group dedups overlapping runs on the same ref.

permissions:
  contents: read

jobs:
  prebuild-devcontainer:
    name: Prebuild DevContainer Image
    # Skip fork PRs: GITHUB_TOKEN is read-only on forks and prebuild requires packages:write + push.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo ".env already exists, skipping"
          fi

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-build and push devcontainer image
        uses: devcontainers/ci@v0.3.1900000450
        with:
          imageName: ghcr.io/th3un1q3/edgent-smith
          cacheFrom: ghcr.io/th3un1q3/edgent-smith
          push: ${{ github.event_name == 'push' && 'always' || 'never' }}

  ci:
    name: Format · Lint · Type-check · Tests · Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prebuild-devcontainer
    if: always() && (needs.prebuild-devcontainer.result == 'success' || needs.prebuild-devcontainer.result == 'skipped')
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          else
            echo ".env already exists, skipping"
          fi

      - name: Disable Compose infra profile for CI
        run: |
          # Truncate compose env (not root .env): disables infra profile services
          # (mcp_gateway, jaeger, serena) for CI, mirrors local --fast.
          : > .devcontainer/.env

      # Run everything inside the existing DevContainer – no separate Python setup.
      - uses: devcontainers/ci@v0.3.1900000450
        with:
          cacheFrom: ghcr.io/th3un1q3/edgent-smith
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            DEVCONTAINER=true
          runCmd: |
            just ci
