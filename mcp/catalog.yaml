name: local
registry:
  tavily:
    type: remote
    description: "Web search engine and content extraction. Provides tavily-search for real-time web queries (news, research, general knowledge) and tavily-extract for fetching and parsing webpage content."  
    title: "Tavily - Web Search & Content Extraction MCP"
    remote:  
      url: "https://mcp.tavily.com/mcp"
      transport_type: http
      headers:
        Authorization: "Bearer ${TAVILY_API_KEY}"
    secrets:
      - name: "tavily.api_token"
        env: "TAVILY_API_KEY"
        example: "your_tavily_api_token_here"
    tools:
      - name: "tavily_search"
      - name: "tavily_extract"

  deepwiki:
    type: remote  
    description: "Search and explore software documentation and developer resources. Queries a curated index of wikis, documentation sites, and knowledge bases for technical reference information."  
    title: "DeepWiki - Documentation & Knowledge Search MCP"
    remote:  
      url: "https://mcp.deepwiki.com/mcp"
      transport_type: http

  serena:
    type: remote
    description: "IDE-like code intelligence for large codebases. Provides symbol search, cross-references, file tree browsing, dependency graphs, and semantic code navigation."
    title: "Serena - Symbol Search & Code Intelligence MCP"
    remote:
      url: "http://serena:9121/mcp"
      transport_type: http

  devtools:
    type: remote
    description: "Chrome DevTools MCP - browser automation, DOM inspection, console, and performance tooling for the host Chrome instance, connected via --autoConnect to the host Chrome instance's CDP endpoint (--browserUrl, currently http://127.0.0.1:58184). chrome-devtools-mcp 1.6.0 is stdio-only; mcp-proxy 6.6.0 runs as a host-OS process (launched by devcontainer initializeCommand) and exposes it as streamable HTTP on /mcp, reachable from the gateway at host.docker.internal:9223."
    title: "Chrome DevTools MCP - Browser Automation & Debugging"
    remote:
      url: "http://host.docker.internal:9223/mcp"
      transport_type: http

  context7:  
    type: remote  
    description: "Structured documentation lookup for programming languages, frameworks, and libraries. Retrieves official docs, APIs, changelogs, and usage examples from authoritative sources."
    title: "Context7 - Official Docs & API Reference Lookup MCP"
    remote:  
      url: "https://mcp.context7.com/mcp"  
      transport_type: http
      headers:
        Authorization: "Bearer ${CONTEXT7_API_KEY}"
    secrets:
      - name: "context7.api_key"   # key used in .env file  
        env: "CONTEXT7_API_KEY"               # name used in ${...} expansion  
        example: "your_context7_api_key_here"

  github:
    type: remote
    description: "Read-only GitHub API access. Browse repositories, search code and issues, view pull requests, commits, branches, diffs, file contents, and repository metadata."
    title: "GitHub - Read-Only Code & Issue, Actions Browser MCP"
    remote:
      url: "https://api.githubcopilot.com/mcp/x/all/readonly"
      transport_type: http
      headers:
        Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
    secrets:
      - name: "github.token"   # key used in .env file
        env: "GITHUB_PERSONAL_ACCESS_TOKEN"               # name used in ${...} expansion
        example: "your_github_personal_access_token_here"

  fetch:
    description: "HTTP fetch tool for retrieving and parsing publicly available web page content. Handles HTML rendering, text extraction, and resource loading."
    title: "Fetch - Public Web Page Content Fetcher MCP"
    type: server
    image: mcp/fetch:latest

  youtube-transcript:
    description: "Fetch transcripts and subtitles for YouTube videos by URL."
    title: "YouTube Transcript MCP"
    type: server
    image: mcp/youtube-transcript:latest

  filesystem:
    type: server
    description: "Local filesystem access via the Rust MCP filesystem server (rust-mcp-stack/rust-mcp-filesystem). Access scope limited by the server allowed-directories (command): .opencode/, agents/, agent_utils/, cli/, evals/, experiments/, mcp/, scripts/, tests/ — writable (ALLOW_WRITE=true). Paths outside this list are denied by the server (e.g., .env, secrets/, .serena/, .git/). digest-pinned; disableNetwork."
    title: "Filesystem (Rust) - Workspace File Access"
    image: "mcp/rust-mcp-filesystem@sha256:0a8d6879a67649fc9801c48e33e39c4f994e5fbfd9b5df8ba7260d63dbc1a242"
    env:
      - name: "ALLOW_WRITE"
        value: "true"
    command:
      - "/workspace/.opencode"
      - "/workspace/agents"
      - "/workspace/agent_utils"
      - "/workspace/cli"
      - "/workspace/evals"
      - "/workspace/experiments"
      - "/workspace/mcp"
      - "/workspace/scripts"
      - "/workspace/tests"
    volumes:
      - "/workspace:/workspace:rw"
    disableNetwork: true

