# Skill eval runner configuration (optional).
#
# Discovery order (first found wins):
#   1. --config <path>
#   2. <skill_dir>/evals/config.toml (or .json)
#   3. <project_root>/evals/config.toml (or .json)  <- this file
#   4. <project_root>/.opencode/evals.toml (or .json)
#   5. built-in defaults
#
# All keys are optional. Missing values fall back to built-in defaults, so a
# zero-config run works out of the box.

[opencode]
# Runtime probe order: free first, paid second, local last (slowest).
models = ["opencode-go/beam-free", "opencode-go/muse-spark-1.3-contributor", "local/spark-x2.5-4b"]

# Path to the opencode binary.
# bin = "opencode"

# Default model for case runs (provider/model). Leave unset to use opencode default.
model = "local/spark-x2.5-4b"

# Agent name passed via --agent. Leave unset to use opencode default.
agent = "rug-swe"

# Retry once with this model when the primary run fails on a rate limit, 429,
# quota, or auth error. Leave unset to disable the retry.
fallback_model = "opencode-go/muse-spark-1.3-contributor"

# Model used for the grader call. Leave unset to use opencode default.
grader_model = "opencode-go/muse-spark-1.3-contributor"

# Fallback for the grader call; it must differ from grader_model, or the retry
# is skipped because a model cannot fall back to itself.
grader_fallback_model = "local/spark-x2.5-4b"

# Agent for the grader call. Empty string means no --agent flag, so the grader
# runs on the opencode default agent instead of the case agent (rug-swe).
grader_agent = "evaluation-grader"

# Other free models discovered via `opencode models | grep -i free`
# (refresh with: opencode models | grep -i free):
#   opencode/beam-free
#   local/qwen3.6-28b-reap20-a3b
#   openrouter/openrouter/free
#   (plus many more; see full list from the command above)

[run]
# Per-case timeout in seconds.
# timeout = 120

# Parallel workers.
# workers = 4

# Grading mode: auto | none.
# grade = "auto"
