# Minimal leaf — flat, no isolates, opencode-go only, no deepseek consumers
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config: {root: ['.']}
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: session
  name: '@deepseek-ai/dsh-session'
- id: typert
  name: '@deepseek-ai/dsh-typert-registry'
- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config: {fallbackMaxWords: 5, fallbackMaxBytes: 40, maxTitleBytes: 80}
- id: agent
  name: '@deepseek-ai/dsh-agent'
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config: {provider: opencode-go, model: deepseek-v4-flash}
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config: {root: !!js dshHomePath('sessions')}
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
- id: goal
  name: '@deepseek-ai/dsh-goal'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config: {sampleOverCapGlobResults: false}
- id: skill
  name: '@deepseek-ai/dsh-skill'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config: {allowParallelInProgress: true}
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
- id: web
  name: '@deepseek-ai/dsh-web'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config: {fetch: false}
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
- id: jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
- id: worker-mcp-gateway
  name: '@deepseek-ai/dsh-mcp-client'
  config: {serverName: gateway, transport: streamable-http, url: http://mcp_gateway:8080/mcp, failOnStartupError: true, toolCallTimeoutMs: 30000}
