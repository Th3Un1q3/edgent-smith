# DeepSeek Harness (dsh) user settings — opencode-parity providers.
# Sources: repo opencode.jsonc (provider.local → dsh `local` provider), prior session config
# (openrouter), live UI state (opencode-go). Drift reconciled 2026-08-22 (live UI rewrite).
# Default model: local/qwen3.6-28b-reap20-a3b — smoke-verified round-trip against the gateway.
# NOTE: opencode.jsonc declares 8 local models but the gateway serves 5; only
# qwen3.6-28b-reap20-a3b overlaps — local runs require a served model id.
llm-pi-ai:
  providers:
    opencode-go:
      apiKeyEnv: OPENCODE_GO_API_KEY
    openrouter:
      apiKeyEnv: OPENROUTER_API_KEY
      displayName: OpenRouter
    local:
      displayName: Local Gateway (host.docker.internal:1289)
      api: openai-completions
      baseURL: http://host.docker.internal:1289/v1
      apiKeyEnv: LOCAL_GATEWAY_API_KEY   # dummy credential via ~/.dsh/.env (keyless endpoint; pi-ai requires non-empty)
      models:
        - { id: glm-4.7-flash-reap-23b-a3b, name: l-glm-4.7-flash-reap-23b-a3b, contextWindow: 128000, maxTokens: 32768 }
        - { id: qwen3.6-28b-reap20-a3b, name: l-qwen3.6-28b, input: [text, image], contextWindow: 128000, maxTokens: 32768 }
        - { id: unsloth/gemma-4-26b-a4b-it-qat, name: l-gemma-4-26b-a4b-ud, input: [text, image], contextWindow: 128000, maxTokens: 32768 }
        - { id: qwen3.6-14b-a3b-fablevibes, name: l-qwen3.6-14b-a3b-fablevibes, input: [text, image], contextWindow: 256000, maxTokens: 65536 }
        - { id: gemma-4-12b-it-mlx, name: l-gemma-4-12b-it-mlx, input: [text, image], contextWindow: 256000, maxTokens: 65536 }
        - { id: qwen3.5-9b-mtp, name: l-qwen3.5-9b-mtp, contextWindow: 256000, maxTokens: 65536 }
        - { id: google/gemma-4-e4b, name: l-gemma-4-e4b }
        - { id: google/gemma-4-e2b, name: l-gemma-4-e2b }
# agent-default-model:
