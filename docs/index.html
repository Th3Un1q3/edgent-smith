<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>docs | reveal.js</title>

		<link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css" />
		<link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
		<link rel="stylesheet" href="theme/blueprint.css" />

		<!-- Fonts: Oswald / Inter / JetBrains Mono (variable, self-hosted) -->
		<link rel="stylesheet" href="node_modules/@fontsource-variable/oswald/index.css" />
		<link rel="stylesheet" href="node_modules/@fontsource-variable/inter/index.css" />
		<link rel="stylesheet" href="node_modules/@fontsource-variable/jetbrains-mono/index.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="node_modules/reveal.js/dist/plugin/highlight/monokai.css" />

		<!-- CopyCode: copy-button styling -->
		<link rel="stylesheet" href="node_modules/reveal.js-copycode/plugin/copycode/copycode.css" />
		<!-- Appearance: entrance animations (bundles Animate.css keyframes) -->
		<link rel="stylesheet" href="node_modules/reveal.js-appearance/plugin/appearance/appearance.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-markdown>
					<textarea data-template>
						## Slide 1
						- bullet
						- list
					</textarea>
				</section>
				<section>
					<h2>Slide 2</h2>
					<pre><code data-trim data-noescape>
						const greeting = "hello";
					</code></pre>
				</section>
			</div>
		</div>

		<script src="node_modules/reveal.js/dist/reveal.js"></script>
		<script src="node_modules/reveal.js/dist/plugin/notes.js"></script>
		<script src="node_modules/reveal.js/dist/plugin/markdown.js"></script>
		<script src="node_modules/reveal.js/dist/plugin/highlight.js"></script>
		<script src="node_modules/reveal.js/dist/plugin/search.js"></script>
		<script src="node_modules/reveal.js/dist/plugin/zoom.js"></script>
		<script src="node_modules/reveal.js-mermaid-plugin/plugin/mermaid/mermaid.js"></script>
		<script src="node_modules/reveal.js-copycode/plugin/copycode/copycode.js"></script>
		<script src="node_modules/reveal.js-appearance/plugin/appearance/appearance.js"></script>
		<script src="node_modules/reveal.js-plugins/anything/plugin.js"></script>
		<script>
			// https://revealjs.com/initialization/ | https://revealjs.com/config/
			Reveal.initialize({
				hash: true,
				controls: true,
				progress: true,
				slideNumber: "c/t",
				center: true,
				transition: "slide",
				plugins: [
					RevealMarkdown,
					RevealHighlight,
					RevealNotes,
					RevealSearch,
					RevealZoom,
					RevealMermaid,
					CopyCode,
					Appearance,
					RevealAnything,
				],
			});
		</script>
	</body>
</html>
